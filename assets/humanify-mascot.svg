<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">lynceus writing analysis mascot</title>
  <desc id="desc">A friendly robot uses a magnifying glass to inspect highlighted writing inside a terminal-style window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.48" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="44" fill="url(#bg)"/>
  <circle cx="104" cy="114" r="78" fill="#22d3ee" opacity="0.18"/>
  <circle cx="1090" cy="550" r="116" fill="#fbbf24" opacity="0.16"/>
  <circle cx="985" cy="124" r="58" fill="#a78bfa" opacity="0.22"/>

  <g opacity="0.45" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round">
    <path d="M98 520h160"/>
    <path d="M940 88h124"/>
    <path d="M1012 150h62"/>
    <path d="M132 574h92"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="118" y="114" width="690" height="448" rx="30" fill="url(#card)"/>
    <rect x="118" y="114" width="690" height="72" rx="30" fill="#111827"/>
    <path d="M118 156h690" stroke="#334155" stroke-width="2"/>
    <circle cx="164" cy="150" r="12" fill="#fb7185"/>
    <circle cx="202" cy="150" r="12" fill="#fbbf24"/>
    <circle cx="240" cy="150" r="12" fill="#34d399"/>
    <text x="292" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#cbd5e1">lynceus review</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" fill="#334155">
      <rect x="162" y="228" width="560" height="28" rx="14" fill="#e0f2fe"/>
      <text x="178" y="251">Every sentence gets a signal.</text>

      <rect x="162" y="290" width="492" height="28" rx="14" fill="#ede9fe"/>
      <text x="178" y="313">Patterns become visible.</text>

      <rect x="162" y="352" width="585" height="28" rx="14" fill="#fef3c7"/>
      <text x="178" y="375">Review the evidence, not a verdict.</text>

      <rect x="162" y="414" width="438" height="28" rx="14" fill="#dcfce7"/>
      <text x="178" y="437">Rewrite with context.</text>
    </g>

    <g transform="translate(666 330) rotate(-18)">
      <circle cx="0" cy="0" r="86" fill="none" stroke="#38bdf8" stroke-width="18"/>
      <circle cx="0" cy="0" r="64" fill="#e0f2fe" opacity="0.35"/>
      <rect x="68" y="62" width="172" height="32" rx="16" fill="#0f172a" transform="rotate(45 68 62)"/>
      <rect x="193" y="164" width="78" height="36" rx="18" fill="#f59e0b" transform="rotate(45 193 164)"/>
    </g>
  </g>

  <g filter="url(#shadow)" transform="translate(812 196)">
    <path d="M126 20h118c45 0 82 37 82 82v146c0 45-37 82-82 82H126c-45 0-82-37-82-82V102c0-45 37-82 82-82Z" fill="url(#robot)" stroke="#e0e7ff" stroke-width="5"/>
    <path d="M185 20V-34" stroke="#c7d2fe" stroke-width="12" stroke-linecap="round"/>
    <circle cx="185" cy="-52" r="18" fill="#fbbf24" filter="url(#softGlow)"/>
    <rect x="92" y="92" width="186" height="116" rx="48" fill="#0f172a"/>
    <circle cx="147" cy="150" r="18" fill="#67e8f9" filter="url(#softGlow)"/>
    <circle cx="223" cy="150" r="18" fill="#67e8f9" filter="url(#softGlow)"/>
    <path d="M142 232c28 26 58 26 86 0" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <path d="M44 172H8c-22 0-40 18-40 40v38" fill="none" stroke="#c7d2fe" stroke-width="22" stroke-linecap="round"/>
    <path d="M326 172h36c22 0 40 18 40 40v38" fill="none" stroke="#c7d2fe" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-32" cy="264" r="27" fill="#f8fafc" stroke="#c7d2fe" stroke-width="8"/>
    <circle cx="402" cy="264" r="27" fill="#f8fafc" stroke="#c7d2fe" stroke-width="8"/>
  </g>

  <g fill="#fef9c3" opacity="0.92" filter="url(#softGlow)">
    <path d="M880 94l12 31 31 12-31 12-12 31-12-31-31-12 31-12Z"/>
    <path d="M786 566l9 23 23 9-23 9-9 23-9-23-23-9 23-9Z"/>
    <path d="M1040 352l8 20 20 8-20 8-8 20-8-20-20-8 20-8Z"/>
  </g>
</svg>
