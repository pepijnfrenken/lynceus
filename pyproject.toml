[project]
name = "humanify"
version = "0.2.0"
description = "AI text pattern analyzer suite with pluggable detection methods"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.30",
    "torch>=2.0",
    "rich>=13.0",
    "numpy>=1.24",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
humanify = "humanify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
