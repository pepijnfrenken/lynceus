[project]
name = "humanify"
version = "0.2.0"
description = "AI text pattern analyzer suite with pluggable detection methods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.30",
    "torch>=2.0",
    "rich>=13.0",
    "numpy>=1.24",
]

[project.scripts]
humanify = "humanify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
